<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Leave Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Employee Leave Portal</h3>
    <form id="leaveForm" class="mb-5">
        <input type="hidden" id="UserId" value="1"> <!-- Example User ID -->

        <div class="mb-3">
            <label>Leave Type</label>
            <select id="LeaveType" class="form-select">
                <option value="Casual">Casual</option>
                <option value="Sick">Sick</option>
                <option value="Earned">Earned</option>
            </select>
        </div>

        <div class="mb-3">
            <label>From Date</label>
            <input type="date" id="FromDate" class="form-control" required />
        </div>

        <div class="mb-3">
            <label>To Date</label>
            <input type="date" id="ToDate" class="form-control" required />
        </div>

        <div class="mb-3">
            <label>Reason</label>
            <textarea id="Reason" class="form-control" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Apply Leave</button>
    </form>

    <h4>My Leave Applications</h4>
    <table class="table table-bordered" id="leaveTable">
        <thead>
            <tr>
                <th>Type</th><th>From</th><th>To</th><th>Status</th><th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/employee.js"></script>
</body>
</html>
